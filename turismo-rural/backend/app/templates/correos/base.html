<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ asunto }}</title>
  </head>
  <!-- Estilos en línea y tablas: muchos clientes de correo ignoran <style> y flexbox -->
  <body style="margin: 0; padding: 0; background: #f5f5f4; font-family: Arial, Helvetica, sans-serif; color: #44403c">
    <!-- Texto que muestra la bandeja de entrada junto al asunto -->
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">{% block resumen %}{% endblock %}</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f5f5f4">
      <tr>
        <td align="center" style="padding: 24px 12px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; background: #ffffff; border-radius: 12px; overflow: hidden"
          >
            <tr>
              <td style="background: #47702e; padding: 20px 28px; color: #ffffff; font-size: 20px; font-weight: bold">
                Turismo Rural
              </td>
            </tr>
            <tr>
              <td style="padding: 28px; font-size: 15px; line-height: 1.55">{% block contenido %}{% endblock %}</td>
            </tr>
            <tr>
              <td style="padding: 16px 28px; background: #fafaf9; border-top: 1px solid #e7e5e4; font-size: 12px; color: #78716c">
                Correo automático de Turismo Rural, por favor no lo respondas.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
