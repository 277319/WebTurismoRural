server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fotos de experiencias: hasta MAX_FOTO_EXPERIENCIA_MB (10 MB) más el resto del formulario
    client_max_body_size 12m;

    # DNS de Docker: con el nombre en una variable, nginx vuelve a resolver "backend" en vez de
    # quedarse con su IP de arranque (que cambia si se recrea solo el backend)
    resolver 127.0.0.11 valid=10s;
    set $backend backend:8000;

    # /api/auth/registro -> http://backend:8000/auth/registro (igual que el proxy de Vite)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos de Vite llevan hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de React Router: cualquier ruta que no sea un archivo devuelve la app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
