services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: turismo
      POSTGRES_PASSWORD: turismo
      POSTGRES_DB: turismo_rural
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo -d turismo_rural"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://turismo:turismo@db:5432/turismo_rural
      MAIL_SERVER: mailpit
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Servidor SMTP de desarrollo: atrapa los correos sin entregarlos y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
