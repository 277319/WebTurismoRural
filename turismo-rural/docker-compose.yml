# Toda la app en http://localhost, con una sola orden y en cualquier ordenador con Docker:
#   docker compose up -d --build
# No hace falta ningún archivo extra: los valores de abajo sirven tal cual. Para cambiarlos (SMTP real,
# Mercado Pago, otro puerto...), copia .env.example a .env y edítalo.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: turismo
      POSTGRES_PASSWORD: turismo
      POSTGRES_DB: turismo_rural
    # Sin puerto publicado: así no choca con un PostgreSQL instalado en el equipo.
    # Para entrar: docker compose exec db psql -U turismo turismo_rural
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turismo -d turismo_rural"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI: al arrancar aplica las migraciones pendientes. Solo se llega a través de nginx (/api)
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://turismo:turismo@db:5432/turismo_rural
      SECRET_KEY: ${SECRET_KEY:-clave-de-desarrollo-cambiala-en-produccion}
      # Para los enlaces de los correos y las páginas de pago
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Destino de los avisos de pago: el simulado se llama a sí mismo; Mercado Pago necesita una URL pública
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      MAIL_SERVER: ${MAIL_SERVER:-mailpit}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # nginx entrega el frontend compilado y redirige /api al backend (frontend/nginx.conf)
  nginx:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PUERTO:-80}:80"
    depends_on:
      - backend

  # Servidor SMTP de prueba: atrapa los correos sin entregarlos y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  pgdata:
  # Fotos subidas por los usuarios
  uploads:
