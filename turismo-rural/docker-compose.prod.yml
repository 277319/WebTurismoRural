# Modo producción: frontend compilado y servido con nginx en http://localhost, backend sin recarga
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Las URLs públicas se pueden cambiar con variables de entorno o en un .env junto a este archivo
services:
  backend:
    # Aplica las migraciones pendientes antes de arrancar; nginx le reenvía las cabeceras X-Forwarded-*
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    restart: unless-stopped
    environment:
      # Para los enlaces de los correos y las páginas de pago
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Destino de los avisos de pago: el simulado se llama a sí mismo; Mercado Pago necesita una URL pública
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    # Solo se llega a través de nginx (/api)
    ports: !reset []
    # El código va dentro de la imagen; solo las fotos subidas quedan fuera, en la misma carpeta que en desarrollo
    volumes: !override
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      target: prod
    restart: unless-stopped
    environment: !reset {}
    ports: !override
      - "80:80"
    volumes: !reset []
